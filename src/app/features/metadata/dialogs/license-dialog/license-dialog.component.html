<div class="flex flex-column gap-4">
  @if (licensesLoading()) {
    <osf-loading-spinner />
  } @else {
    <h3>{{ 'project.metadata.license.dialog.chooseLicense.label' | translate }}</h3>

    <osf-license
      appendTo="body"
      [licenses]="licenses()"
      [selectedLicenseId]="selectedLicenseId()"
      [selectedLicenseOptions]="initialLicenseOptions"
      [showInternalButtons]="false"
      (selectLicense)="selectedLicenseId.set($event.id)"
      (licenseStateChange)="licenseState.set($event)"
    />
  }

  <div class="flex justify-content-end gap-2">
    <p-button severity="info" [label]="'common.buttons.cancel' | translate" (onClick)="cancel()" />
    <p-button [label]="'common.buttons.save' | translate" [disabled]="isSaveDisabled()" (onClick)="save()" />
  </div>
</div>
