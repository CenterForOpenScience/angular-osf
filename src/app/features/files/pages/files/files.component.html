<osf-sub-header [title]="'navigation.files' | translate"></osf-sub-header>

@if (!dataLoaded()) {
  <osf-loading-spinner></osf-loading-spinner>
} @else {
  <div class="flex flex-column bg-white gap-4 h-full flex-1 p-4 p-dialog-align-center">
    @if (hasViewOnly()) {
      <osf-view-only-link-message />
    }

    <div class="flex flex-grow-0 w-full sm:w-30rem">
      @if (!isRegistration()) {
        <p-select
          class="w-full"
          inputId="in_label"
          variant="filled"
          [options]="rootFoldersOptions()"
          [disabled]="isButtonDisabled()"
          [(ngModel)]="currentRootFolder"
          (onChange)="handleRootFolderChange($event.value)"
        />
      }
    </div>
    @if (filesSelection.length) {
      @if (!isMoveDialogOpened()) {
        <osf-files-selection-actions
          [canUpdateFiles]="canUploadFiles()"
          [selectedFilesCount]="filesSelection.length"
          [hasViewOnly]="hasViewOnly()"
          [isProjectReadOnly]="isProjectReadOnly()"
          (deleteSelected)="onDeleteSelected()"
          (moveSelected)="onMoveSelected()"
          (copySelected)="onCopySelected()"
          (clearSelection)="clearFilesSelection()"
        ></osf-files-selection-actions>
      }
    } @else {
      <div class="flex flex-column gap-4 md:justify-content-between md:flex-row md:flex-wrap">
        <div class="flex flex-column gap-2 w-full sm:flex-row md:w-max">
          <osf-search-input
            [control]="searchControl"
            class="w-full sm:w-9 xl:w-30rem"
            [placeholder]="'files.searchPlaceholder' | translate"
          />

          <div class="sm:w-3 md:w-max">
            <osf-form-select
              [control]="sortControl"
              [options]="sortOptions"
              [placeholder]="'files.sort.placeholder'"
              [fullWidth]="true"
            ></osf-form-select>
          </div>
        </div>

        <div class="flex flex-column align-items-center w-full gap-2 sm:flex-row md:w-max">
          <p-button
            [disabled]="isButtonDisabled()"
            outlined
            raised
            (onClick)="downloadFolder()"
            [icon]="'fas fa-download'"
            [label]="'files.actions.downloadAsZip' | translate"
          >
          </p-button>

          <p-button
            icon="fas fa-info-circle blue-icon"
            severity="secondary"
            text
            (onClick)="showInfoDialog()"
          ></p-button>

          @if (canUploadFiles() && !hasViewOnly()) {
            <p-button
              [disabled]="isButtonDisabled() || isProjectReadOnly()"
              [pTooltip]="isProjectReadOnly() ? ('common.errorMessages.actionUnavailable' | translate) : ''"
              outlined
              raised
              severity="success"
              [icon]="'fas fa-plus'"
              [label]="'files.actions.createFolder' | translate"
              (onClick)="createFolder()"
            >
            </p-button>

            <p-button
              [disabled]="isButtonDisabled() || isProjectReadOnly()"
              [pTooltip]="isProjectReadOnly() ? ('common.errorMessages.actionUnavailable' | translate) : ''"
              outlined
              raised
              severity="success"
              [icon]="'fas fa-upload'"
              [label]="'files.actions.uploadFile' | translate"
              (onClick)="fileInput.click()"
            >
            </p-button>

            @if (isGoogleDrive()) {
              <p-button
                [disabled]="isGoogleDriveButtonDisabled() || isProjectReadOnly()"
                [pTooltip]="isProjectReadOnly() ? ('common.errorMessages.actionUnavailable' | translate) : ''"
                outlined
                raised
                severity="success"
                [icon]="'fa-brands fa-google-plus-g'"
                [label]="'files.actions.addFromDrive' | translate"
                (onClick)="googleFilePickerComponent()?.createPicker()"
              >
              </p-button>
              <osf-google-file-picker
                [rootFolder]="selectedRootFolder()"
                [accountId]="accountId()"
                [isFolderPicker]="false"
                [handleFolderSelection]="updateFilesList"
              ></osf-google-file-picker>
            }
          }
          <input #fileInput type="file" multiple class="hidden" (change)="onFileSelected($event)" />
        </div>
      </div>
    }
    <osf-file-upload-dialog
      [(visible)]="fileIsUploading"
      [fileName]="fileName()"
      [progress]="progress()"
    ></osf-file-upload-dialog>

    <osf-files-tree-explorer
      [files]="files()"
      [totalCount]="filesTotalCount()"
      [currentFolder]="currentFolder()!"
      [storage]="currentRootFolder()!"
      [isLoading]="isFilesLoading()"
      [viewOnly]="!canEdit()"
      [supportUpload]="canUploadFiles()"
      [resourceId]="resourceId()"
      [resourceType]="currentResourceType()"
      [allowedMenuActions]="allowedMenuActions()"
      [scrollHeight]="'500px'"
      [selectedFiles]="filesSelection"
      [(foldersStack)]="foldersStack"
      (fileSelected)="onFileTreeSelected($event)"
      (fileUnselected)="onFileTreeUnselected($event)"
      (deleteFile)="deleteEntry($event)"
      (fileOpened)="navigateToFile($event)"
      (renameFile)="onRenameFile($event)"
      (uploadFiles)="confirmTreeUpload($event)"
      (loadFiles)="onLoadFiles($event)"
      (currentFolderChanged)="setCurrentFolder($event)"
      (menuMoveCopy)="onMenuMoveCopy($event)"
      (dropMove)="onDropMove($event)"
    >
    </osf-files-tree-explorer>
  </div>
}
