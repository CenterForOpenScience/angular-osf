<p-select
  data-test-select-license
  class="w-full"
  optionLabel="name"
  [options]="licenses()"
  [ngModel]="selectedLicense()"
  [placeholder]="'shared.license.selectLicense' | translate"
  [appendTo]="appendTo()"
  (onChange)="onSelectLicense($event.value)"
/>

@let license = selectedLicense();

@if (license) {
  <p-divider class="my-3" />
  @if (hasRequiredFields()) {
    <form [formGroup]="licenseForm" class="flex flex-column gap-3 mb-3 w-full md:flex-row">
      <div class="w-full md:w-6">
        <label [for]="yearInputId"> {{ 'common.labels.year' | translate }} </label>
        <p-datePicker
          formControlName="year"
          dataType="string"
          view="year"
          dateFormat="yy"
          [inputId]="yearInputId"
          [maxDate]="today"
        />

        @if (
          licenseForm.controls.year.invalid && (licenseForm.controls.year.touched || licenseForm.controls.year.dirty)
        ) {
          <p-message class="simple-variant flex mt-1" severity="error" variant="simple" size="small">
            {{ requiredMessage | translate }}
          </p-message>
        }
      </div>
      <osf-text-input
        class="w-full md:w-6"
        label="shared.license.copyrightHolders"
        [control]="licenseForm.controls.copyrightHolders"
        [maxLength]="inputLimits.fullName.maxLength"
      />
    </form>
  }

  <p class="highlight-block">
    <osf-truncated-text [text]="license.text | interpolate: licenseFormValue()" />
  </p>

  @if (hasRequiredFields() && showInternalButtons()) {
    <section class="mt-6 flex flex-row justify-content-end align-items-center gap-2">
      <p-button
        class="w-6 md:w-6rem"
        styleClass="w-full"
        [label]="'common.buttons.cancel' | translate"
        severity="info"
        (onClick)="cancel()"
      />
      <p-button
        class="w-6 md:w-9rem"
        styleClass="w-full"
        [label]="'common.buttons.save' | translate"
        [disabled]="licenseFormInvalid() || saveButtonDisabled()"
        (onClick)="saveLicense()"
      />
    </section>
  }
}
